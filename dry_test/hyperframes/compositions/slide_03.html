<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 03 - 서늘한 진실</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000;
        font-family: "Pretendard", sans-serif;
      }
      #composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: url("../../asset/image_3.jpeg");
        background-size: cover;
        background-position: center;
        filter: brightness(0.7) contrast(1.2);
      }
      .text-common {
        position: absolute;
        color: white;
        text-shadow: 4px 4px 15px rgba(0, 0, 0, 0.9);
        font-weight: 900;
        white-space: nowrap;
        opacity: 0;
        transform: translate(-50%, -50%);
      }
      .text-1 {
        font-size: 110px;
        left: calc(50% + 500px);
        top: calc(50% + 80px);
        color: #ff3d00; /* Intense Red FX */
      }
      .text-2 {
        font-size: 75px;
        left: calc(50% + 500px);
        top: calc(50% + -20px);
        color: #b0bec5; /* Cold Gray */
      }
      .text-3 {
        font-size: 65px;
        left: calc(50% + 500px);
        top: calc(50% + -120px);
      }
      .shake-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="composition" data-composition-id="slide-03" data-duration="27.23">
      <div class="shake-container">
        <div class="bg"></div>
      </div>
      <div class="text-common text-3">눈 뜨고 코 베임</div>
      <div class="text-common text-2">서늘한 진실</div>
      <div class="text-common text-1">90만 배럴</div>
    </div>

    <script>
      const tl = gsap.timeline();

      // Ken Burns: Zoom-center
      tl.fromTo(".bg", { scale: 1.0 }, { scale: 1.2, duration: 27.23, ease: "power1.inOut" }, 0);

      // GritShake Effect (Trigger at the middle)
      tl.to(
        ".shake-container",
        {
          x: "random(-10, 10)",
          y: "random(-10, 10)",
          duration: 0.05,
          repeat: 20,
          yoyo: true,
          ease: "none",
        },
        5.0
      );

      // Text Sequence
      tl.to(
        ".text-3",
        {
          opacity: 1,
          y: "+=20",
          duration: 0.5,
          ease: "power4.out",
        },
        1.0
      );

      tl.to(
        ".text-2",
        {
          opacity: 1,
          x: "-=20",
          duration: 0.5,
          ease: "power4.out",
        },
        1.8
      );

      tl.to(
        ".text-1",
        {
          opacity: 1,
          scale: 1.5,
          duration: 0.4,
          ease: "back.out(2)",
        },
        2.6
      );

      // FX Pulse for "90만 배럴"
      tl.to(
        ".text-1",
        {
          scale: 1.6,
          filter: "drop-shadow(0 0 20px rgba(255, 61, 0, 0.8))",
          duration: 0.3,
          repeat: -1,
          yoyo: true,
        },
        3.0
      );
    </script>
  </body>
</html>
