<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 01 - 우선 구매권 비유</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000;
        font-family: "Pretendard", sans-serif;
      }
      #composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: url("../../asset/image_1.jpeg");
        background-size: cover;
        background-position: center;
      }
      .text-common {
        position: absolute;
        color: white;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
        font-weight: 800;
        white-space: nowrap;
        opacity: 0;
        transform: translate(-50%, -50%);
      }
      .text-1 {
        font-size: 80px;
        left: calc(50% + -480px);
        top: calc(50% + 50px);
        color: #ffd700; /* Gold for FX */
      }
      .text-2 {
        font-size: 60px;
        left: calc(50% + -480px);
        top: calc(50% + -50px);
      }
      .fx-glow {
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
      }
    </style>
  </head>
  <body>
    <div id="composition" data-composition-id="slide-01" data-duration="31.8">
      <div class="bg"></div>
      <div class="text-common text-1 fx-glow">우선 구매권</div>
      <div class="text-common text-2">확실한 보험</div>
    </div>

    <script>
      const tl = gsap.timeline();

      // Ken Burns: Pan-right
      tl.fromTo(
        ".bg",
        { scale: 1.1, x: -50 },
        { scale: 1.0, x: 50, duration: 31.8, ease: "none" },
        0
      );

      // ZoomPulse Effect on Subject Area (480, 0)
      tl.to(
        ".bg",
        {
          scale: 1.05,
          duration: 2,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
        },
        0
      );

      // Text Animations
      tl.to(
        ".text-2",
        {
          opacity: 1,
          y: "-=20",
          duration: 0.6,
          ease: "power2.out",
        },
        1.5
      );

      tl.to(
        ".text-1",
        {
          opacity: 1,
          scale: 1.2,
          duration: 0.8,
          ease: "back.out(1.7)",
        },
        2.5
      );

      // FX Pulse for "우선 구매권"
      tl.to(
        ".text-1",
        {
          scale: 1.3,
          duration: 0.5,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
        },
        3.3
      );
    </script>
  </body>
</html>
